# ====================================================================
# SheSafe Database & Notification Configuration
# ====================================================================

# 1. MySQL Database Settings
db.url=jdbc:mysql://localhost:3306/shesafe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# 2. Emergency Notification Settings (JavaMail / SMTP)
# Modes:
#   'test_mode' : Simulates dispatch, logs alerts to MySQL and console with full diagnostics (default for safe testing)
#   'smtp'      : Sends live email notifications via configured SMTP mail server
notification.mode=test_mode

# SMTP Mail Server Configuration (e.g. Gmail, Outlook, or custom server)
# Note: For Gmail, use an "App Password" generated in Google Account Security, not your personal password.
smtp.host=smtp.gmail.com
smtp.port=587
smtp.auth=true
smtp.starttls.enable=true
smtp.user=
smtp.password=
notification.sender.name=SheSafe Emergency Broadcast System
